<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2340">
<title>Ukens oppdrag</title>
<style>
  :root{--navy:#1d2340;--orange:#ff8a5b;--yellow:#ffc857;--bg:#fff8ef}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
  .hero{background:var(--navy);color:#fff;padding:28px 22px 46px;position:relative;border-radius:0 0 28px 28px}
  .kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--yellow);font-weight:800}
  h1{font-size:34px;font-weight:900;letter-spacing:-1px;margin-top:4px}
  h1 em{font-style:normal;color:var(--orange)}
  .hi{color:#c9cfe6;margin-top:4px;font-size:15px}
  .badge{position:absolute;right:18px;top:22px;width:78px;height:78px;transform:rotate(12deg)}
  .days{display:flex;gap:6px;padding:0 14px;margin-top:-24px;position:relative}
  .day{flex:1;border:none;background:#fff;border-radius:14px;padding:8px 0 6px;font-weight:800;font-size:13px;color:var(--navy);box-shadow:0 3px 10px rgba(29,35,64,.12);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .day.we{color:var(--orange)}
  .day.active{background:var(--navy);color:#fff}
  .day.we.active{background:var(--orange)}
  .day .dots{font-size:9px;opacity:.8;height:12px}
  .day.done .dots{color:var(--yellow)}
  .prog{margin:20px 18px 6px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:14px}
  .bar{flex:1;height:12px;background:#ece4d6;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));width:0;transition:width .4s}
  .list{padding:8px 14px;display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px;border:none;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 2px 0 rgba(29,35,64,.07);position:relative;overflow:hidden;transition:transform .1s}
  .task:active{transform:scale(.98)}
  .task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
  .ico{width:46px;height:46px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:4px}
  .ico svg{width:26px;height:26px}
  .name{flex:1;font-weight:800;font-size:16px}
  .name small{display:block;font-weight:600;font-size:12px;color:#8a90a8;margin-top:2px}
  .chk{width:38px;height:38px;border-radius:50%;border:3px dashed var(--c);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .chk svg{width:22px;height:22px;opacity:0;transform:scale(.4);transition:all .25s}
  .task.on{background:color-mix(in srgb,var(--c) 14%,#fff)}
  .task.on .chk{background:var(--c);border-style:solid}
  .task.on .chk svg{opacity:1;transform:scale(1)}
  .task.on .name{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
  .week{margin:18px 14px 0;background:var(--yellow);border-radius:18px;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .stars{display:flex;gap:3px}
  .stars svg{width:22px;height:22px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .3s;z-index:9;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
  .modal{position:fixed;inset:0;background:rgba(29,35,64,.6);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  .modal div{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:340px;text-align:center}
  .modal h2{font-size:22px;margin-bottom:6px}
  .modal p{color:#6b7590;margin-bottom:16px}
  .modal input{width:100%;font-size:18px;padding:12px;border:2px solid #e2e5ef;border-radius:12px;margin-bottom:12px;text-align:center}
  .modal button{width:100%;font-size:17px;font-weight:800;padding:13px;border:none;border-radius:12px;background:var(--orange);color:#fff}
  .price{flex-shrink:0;font-weight:900;font-size:14px;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--navy);padding:6px 10px;border-radius:99px}
  .task.on .price{background:var(--c);color:#fff}
  .task.locked{cursor:default}
  .task.locked .chk{opacity:.35}
  .lockmsg{margin:4px 18px 0;font-size:13px;font-weight:700;color:#8a90a8;text-align:center}
  .money{margin:14px 14px 0;background:var(--navy);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
  .money .lbl{font-size:13px;color:#c9cfe6;font-weight:700}
  .money .big{font-size:30px;font-weight:900;color:var(--yellow);letter-spacing:-.5px}
  .money .wk{text-align:right}
  .money .wk .big{font-size:22px;color:#fff}
  .foot{text-align:center;color:#a0a5ba;font-size:12px;margin-top:22px}
  .foot button{background:none;border:none;color:#a0a5ba;text-decoration:underline;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="kicker">★ Husets helt ★</div>
    <h1>Ukens <em>oppdrag</em></h1>
    <div class="hi" id="hi">Trykk på et oppdrag når det er gjort!</div>
    <svg class="badge" viewBox="0 0 100 100"><path d="M50 2 L61 14 L77 9 L80 25 L96 31 L89 46 L98 60 L84 69 L84 86 L67 86 L58 100 L50 91 L42 100 L33 86 L16 86 L16 69 L2 60 L11 46 L4 31 L20 25 L23 9 L39 14Z" fill="#ffc857"/><circle cx="50" cy="52" r="30" fill="none" stroke="#1d2340" stroke-width="2" stroke-dasharray="3 3"/><text x="50" y="47" text-anchor="middle" font-size="11" font-weight="900" fill="#1d2340">DU</text><text x="50" y="61" text-anchor="middle" font-size="11" font-weight="900" fill="#1d2340">KLARER</text><text x="50" y="74" text-anchor="middle" font-size="11" font-weight="900" fill="#1d2340">DET!</text></svg>
  </div>
  <div class="days" id="days"></div>
  <div class="prog"><span id="cnt">0/9</span><div class="bar"><i id="bar"></i></div><span>🏆</span></div>
  <div class="lockmsg" id="lockmsg"></div>
  <div class="list" id="list"></div>
  <div class="money"><div><div class="lbl" id="daylbl">Tjent i dag</div><div class="big" id="daysum">0,-</div></div><div class="wk"><div class="lbl">Tjent denne uka</div><div class="big" id="weeksum">0,-</div></div></div>
  <div class="week"><span>Dager med alt gjort</span><div class="stars" id="stars"></div></div>
  <div class="foot"><span id="wk"></span> · <button id="rename">Bytt navn</button></div>
</div>
<div class="toast" id="toast"></div>
<canvas class="confetti" id="cf"></canvas>

<script>
/* ===== INNSTILLINGER ===== */
// Varsler sendes via ntfy.sh. Installer appen «ntfy» på mobilen din og abonner på dette emnet:
const NTFY_TOPIC = "ukens-oppdrag-24a87790ff";
/* ========================= */

const DAYS=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const S=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const TASKS=[
 ["Rydde rom",10,"#3fa7d6",'<path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/>'],
 ["Lage middag",20,"#ff8a5b",'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1 1-2 0-3M13 7c0-1 1-2 0-3"/>'],
 ["Gå ut med søpla",5,"#2bb673",'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'],
 ["Støvsuge stue/kjøkken",15,"#8e6cef",'<circle cx="7" cy="17" r="3"/><path d="M10 17h8l1-4H9M19 13V4"/>'],
 ["Støvsuge trapp, gang og bad",15,"#d264b6",'<path d="M3 20h5v-5h5v-5h5V5h3"/>'],
 ["Full shine soverom",50,"#f2b632",'<path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/>'],
 ["Ta inn/ut av oppvaskmaskin",10,"#1f8fbf",'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16"/><circle cx="12" cy="14" r="3"/>'],
 ["Henge opp/ta ned tøy",10,"#ef5b5b",'<path d="M8 4l-5 4 3 3 2-1v10h8V10l2 1 3-3-5-4c0 2-2 3-4 3S8 6 8 4z"/>'],
 ["Gå over og rydde kjøkkenbenken",10,"#14b8a6",'<path d="M2 13h20M4 13v7M20 13v7"/><path d="M9 4h4l2 3v6H9z"/><path d="M13 4h3"/>']
];
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+"-"+Math.ceil(((d-y)/864e5+1)/7)}
let WEEK=isoWeek(new Date()), TODAY=(new Date().getDay()+6)%7;
let sel=TODAY;

const store={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let name=store.get("oppdrag-navn","");
const N=TASKS.length;
let data;
function load(){const raw=store.get("oppdrag-"+WEEK,[]);data=DAYS.map((_,d)=>TASKS.map((_,t)=>!!(raw[d]&&raw[d][t])))}
load();
const kr=v=>v+",-";
const daySum=d=>data[d].reduce((a,on,i)=>a+(on?TASKS[i][1]:0),0);
const weekSum=()=>DAYS.reduce((a,_,d)=>a+daySum(d),0);
function checkDate(){const w=isoWeek(new Date()),t=(new Date().getDay()+6)%7;if(w!==WEEK||t!==TODAY){WEEK=w;TODAY=t;sel=t;load();render()}}
setInterval(checkDate,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDate()});

function notify(title,message,tags){
  return fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic:NTFY_TOPIC,title,message,tags})})
    .then(r=>{if(!r.ok)throw 0;return true}).catch(()=>false);
}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2400)}

function render(){
  document.getElementById("hi").textContent=name?`Hei ${name}! Trykk når et oppdrag er gjort.`:"Trykk på et oppdrag når det er gjort!";
  document.getElementById("wk").textContent="Uke "+WEEK.split("-")[1];
  document.getElementById("days").innerHTML=DAYS.map((d,i)=>{const c=data[i].filter(Boolean).length;return `<button class="day ${i>4?"we":""} ${i===sel?"active":""} ${c===N?"done":""}" data-d="${i}">${d.slice(0,3)}<span class="dots">${c?kr(daySum(i)):""}</span></button>`}).join("");
  const locked=sel!==TODAY;
  document.getElementById("lockmsg").textContent=locked?(sel<TODAY?`${DAYS[sel]} er over – du kan bare krysse av i dag.`:`${DAYS[sel]} har ikke kommet ennå.`):`I dag er det ${DAYS[TODAY].toLowerCase()} 💪`;
  document.getElementById("list").innerHTML=TASKS.map(([n,v,c,p],i)=>`<button class="task ${data[sel][i]?"on":""} ${locked?"locked":""}" style="--c:${c}" data-t="${i}"><span class="ico">${S(p)}</span><span class="name">${n}</span><span class="price">${kr(v)}</span><span class="chk">${CHECK}</span></button>`).join("");
  document.getElementById("daylbl").textContent=locked?`Tjent ${DAYS[sel].toLowerCase()}`:"Tjent i dag";
  document.getElementById("daysum").textContent=kr(daySum(sel));
  document.getElementById("weeksum").textContent=kr(weekSum());
  const c=data[sel].filter(Boolean).length;
  document.getElementById("cnt").textContent=c+"/"+N;
  document.getElementById("bar").style.width=(c/N*100)+"%";
  document.getElementById("stars").innerHTML=data.map(d=>{const full=d.every(Boolean);return `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.7-5 4.5 1.4 6.6L12 17l-5.9 3.4 1.4-6.6-5-4.5 6.6-.7z" fill="${full?"#1d2340":"none"}" stroke="#1d2340" stroke-width="1.8" stroke-linejoin="round"/></svg>`}).join("");
}

document.getElementById("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;sel=+b.dataset.d;render()});
document.getElementById("list").addEventListener("click",async e=>{
  const b=e.target.closest(".task");if(!b)return;checkDate();
  if(sel!==TODAY){toast("Du kan bare krysse av for i dag");return}
  const i=+b.dataset.t, on=!data[sel][i];
  data[sel][i]=on;store.set("oppdrag-"+WEEK,data);render();
  const who=name||"Sønnen din", day=DAYS[sel].toLowerCase();
  if(on){
    const allDone=data[sel].every(Boolean);
    const ok=await notify(`✅ ${who}: ${TASKS[i][0]} (+${kr(TASKS[i][1])})`,`Gjort ${day} kl. ${new Date().toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"})}. I dag: ${kr(daySum(sel))} · Uka: ${kr(weekSum())}`,["white_check_mark"]);
    if(allDone){confetti();await notify(`🌟 ${who} har gjort ALT ${day}!`,`Alle ${N} oppdrag er fullført – ${kr(daySum(sel))} i dag.`,["star2","tada"])}
    toast(ok?(allDone?"Alt gjort! Mamma er varslet 🎉":`+${kr(TASKS[i][1])}! Mamma er varslet 👍`):"Lagret – men varselet ble ikke sendt (sjekk nett)");
  }else{
    notify(`↩️ ${who} angret: ${TASKS[i][0]} (−${kr(TASKS[i][1])})`,`I dag: ${kr(daySum(sel))} · Uka: ${kr(weekSum())}`,["leftwards_arrow_with_hook"]);
    toast("Kryss fjernet");
  }
});

function askName(){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div><h2>Hei! 👋</h2><p>Hva heter du?</p><input id="nm" value="${name}" placeholder="Navnet ditt"><button id="ok">Start</button></div>`;
  document.body.appendChild(m);const inp=m.querySelector("#nm");inp.focus();
  const go=()=>{name=inp.value.trim();store.set("oppdrag-navn",name);m.remove();render()};
  m.querySelector("#ok").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
}
document.getElementById("rename").onclick=askName;

function confetti(){
  const cv=document.getElementById("cf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ff8a5b","#ffc857","#3fa7d6","#2bb673","#8e6cef","#ef5b5b"];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,s:4+Math.random()*6,c:cols[Math.random()*6|0]}));
  let f=0;(function tick(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<160)requestAnimationFrame(tick);else x.clearRect(0,0,cv.width,cv.height)})();
}

render();
if(!name)askName();
</script>
</body>
</html>
